apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs42
spec:
  selector:
    matchLabels:
      app: jobs42      
  template:
    metadata:
      labels:
        app: jobs42
    spec:
      containers:
      - name: jobs42
        image: europe-central2-docker.pkg.dev/helpful-brand-400112/job42/binary:latest
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
