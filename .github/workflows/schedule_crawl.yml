name: Crawler CRON

on:
  workflow_dispatch: # Enables manual triggering from the UI to test current workflow
  schedule:
    # This action is scheduled 2 times a day with 12-hour interval, everyday: 00:30, 12:30 UTC
    # Why 00:30 and 12:30? Because schedules can be delayed in periods of high-loads.
    # High-load periods are usually the start of every hour
    - cron: '30 0,12 * * *' 
    

jobs:
  crawl:
    runs-on: ubuntu-latest

    # Define environment variables that are available all steps
    env:
      GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
      GCP_VM_USER: ${{ secrets.GCP_VM_USER }}

    steps:
      # Checkout action is needed to clone repo to vm runner
      - uses: actions/checkout@v6

      # By default vm runner comes with pre-installed, but we explicitly need to specify to avoid version mismatches
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -o bin/crawler ./cmd/crawler

      - name: Give permission to execute binary
        run: chmod +x bin/crawler

      - name: Run crawler
        run: ./bin/crawler

      # Workflow run successfully until this point. Need to test following steps:
      
      # After crawler step is finished, we need to upload ./data to VM, for that we can use scp
      # But first, we need to configure ssh in vm runner of GitHub
      - name: Configure SSH
        env:
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
         
        run: chmod +x ./scripts/setup_ssh.sh && ./scripts/setup_ssh.sh
      
      - name: Transfer ./data via scp
        # Here ~/jobs/data/ should be destination for generated result in VM
        run: scp -r ./data $GCP_VM_USER@$GCP_VM_IP:~/jobs/data/